name: Installers

# Builds Pigeon's installers, installs each on a clean runner and checks the installed program.
# On a v* tag it also creates a draft prerelease with them, which a person reviews and publishes.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'packaging/**'
      - 'src/**'
      - 'global.json'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Version
        id: version
        shell: bash
        run: echo "value=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/Pigeon.Cli/Pigeon.Cli.csproj)" >> "$GITHUB_OUTPUT"

      - name: Publish
        run: dotnet publish src/Pigeon.Cli/Pigeon.Cli.csproj -c Release -r win-x64 -o artifacts/win-x64

      - name: Build the MSI
        shell: pwsh
        run: dotnet build packaging/windows/Pigeon.Installer.wixproj -c Release -p:PigeonVersion=${{ steps.version.outputs.value }} "-p:PublishDir=$((Resolve-Path artifacts/win-x64).Path)" -o artifacts/out

      - name: Install, check and uninstall
        shell: pwsh
        run: |
          $msi = (Resolve-Path artifacts/out/*.msi).Path
          $install = Start-Process msiexec -ArgumentList '/i', "`"$msi`"", '/qn', '/l*v', 'install.log' -Wait -PassThru
          if ($install.ExitCode -ne 0) { Get-Content install.log -Tail 40; throw "msiexec /i exited $($install.ExitCode)" }
          $folder = Join-Path $env:LOCALAPPDATA 'Programs\Pigeon'
          if (-not (Test-Path (Join-Path $folder 'pigeon.exe'))) { throw "pigeon.exe is not in $folder" }
          $path = [Environment]::GetEnvironmentVariable('PATH', 'User')
          # Windows Installer writes folder properties with a trailing backslash.
          if (-not (($path -split ';' | ForEach-Object { $_.TrimEnd('\') }) -contains $folder)) { throw "The user PATH does not contain $folder" }
          & (Join-Path $env:ProgramFiles 'Git\bin\bash.exe') packaging/smoke-test.sh "$folder\pigeon.exe" '${{ steps.version.outputs.value }}'
          if ($LASTEXITCODE -ne 0) { throw 'The smoke test failed' }
          $remove = Start-Process msiexec -ArgumentList '/x', "`"$msi`"", '/qn' -Wait -PassThru
          if ($remove.ExitCode -ne 0) { throw "msiexec /x exited $($remove.ExitCode)" }
          if (Test-Path (Join-Path $folder 'pigeon.exe')) { throw 'pigeon.exe is still there after uninstalling' }

      # An old build (0.0.1) installed by its MSI updates itself to the newest published release,
      # with its service running on a test port, database and identity folder.
      - name: Update an old install
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          dotnet publish src/Pigeon.Cli/Pigeon.Cli.csproj -c Release -r win-x64 -p:Version=0.0.1 -o artifacts/old
          if ($LASTEXITCODE -ne 0) { throw 'Publishing 0.0.1 failed' }
          # Its own obj folder: otherwise WiX takes the earlier build as up to date and copies nothing.
          dotnet build packaging/windows/Pigeon.Installer.wixproj -c Release -p:PigeonVersion=0.0.1 "-p:PublishDir=$((Resolve-Path artifacts/old).Path)" "-p:IntermediateOutputPath=$env:RUNNER_TEMP\old-obj\" -o artifacts/old-msi
          if ($LASTEXITCODE -ne 0) { throw 'Building the 0.0.1 MSI failed' }
          $msi = (Resolve-Path artifacts/old-msi/*.msi).Path
          $install = Start-Process msiexec -ArgumentList '/i', "`"$msi`"", '/qn' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "msiexec /i exited $($install.ExitCode)" }
          $pigeon = Join-Path $env:LOCALAPPDATA 'Programs\Pigeon\pigeon.exe'
          $env:PIGEON_PORT = '29683'
          $env:PIGEON_DATABASE = Join-Path $env:RUNNER_TEMP 'update.db'
          $env:PIGEON_IDENTITY_DIR = Join-Path $env:RUNNER_TEMP 'update-identity'
          & $pigeon start
          & $pigeon update --allow-pre-release
          if ($LASTEXITCODE -ne 0) {
            foreach ($log in (Join-Path $env:TEMP 'pigeon-update.log'), (Join-Path ([IO.Path]::GetTempPath()) 'pigeon-update.log')) {
              if (Test-Path $log) { Select-String -Path $log -Pattern 'Return value 3|error|Error \d|MainEngineThread is returning|Product: ' | Select-Object -Last 40 | ForEach-Object Line; break }
            }
            Get-ChildItem (Split-Path $pigeon) -ErrorAction SilentlyContinue
            throw 'pigeon update failed'
          }
          $version = & $pigeon --version
          if ($version -eq '0.0.1') { throw 'pigeon update left version 0.0.1' }
          Write-Output "Updated to $version"
          & $pigeon stop
          if ($LASTEXITCODE -ne 0) { throw 'The service did not run again after the update' }

      - uses: actions/upload-artifact@v4
        with:
          name: installers-windows
          path: artifacts/out/*.msi

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Version
        id: version
        run: echo "value=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/Pigeon.Cli/Pigeon.Cli.csproj)" >> "$GITHUB_OUTPUT"

      - name: Publish and package
        run: |
          for rid in osx-arm64 osx-x64; do
            dotnet publish src/Pigeon.Cli/Pigeon.Cli.csproj -c Release -r "$rid" -o "artifacts/$rid"
            sh packaging/macos/build-pkg.sh '${{ steps.version.outputs.value }}' "$rid" "artifacts/$rid" artifacts/out
          done

      # The runner is an Apple Silicon Mac: the arm64 package installs, the Intel one refuses.
      - name: Install and check
        run: |
          version='${{ steps.version.outputs.value }}'
          sudo installer -pkg "artifacts/out/Pigeon-$version-osx-arm64.pkg" -target /
          sh packaging/smoke-test.sh /usr/local/bin/pigeon "$version"
          if sudo installer -pkg "artifacts/out/Pigeon-$version-osx-x64.pkg" -target / 2>/dev/null; then
            echo "The Intel package installed on an Apple Silicon Mac." >&2
            exit 1
          fi

      # An old build (0.0.1) installed by its package updates itself to the newest published
      # release, with its service running on a test port, database and identity folder.
      - name: Update an old install
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          dotnet publish src/Pigeon.Cli/Pigeon.Cli.csproj -c Release -r osx-arm64 -p:Version=0.0.1 -o artifacts/old
          sh packaging/macos/build-pkg.sh 0.0.1 osx-arm64 artifacts/old artifacts/old-pkg
          sudo installer -pkg artifacts/old-pkg/Pigeon-0.0.1-osx-arm64.pkg -target /
          export PIGEON_PORT=29683 PIGEON_DATABASE="$RUNNER_TEMP/update.db" PIGEON_IDENTITY_DIR="$RUNNER_TEMP/update-identity"
          /usr/local/bin/pigeon start
          /usr/local/bin/pigeon update --allow-pre-release
          version=$(/usr/local/bin/pigeon --version)
          [ "$version" != 0.0.1 ] || { echo "pigeon update left version 0.0.1" >&2; exit 1; }
          echo "Updated to $version"
          /usr/local/bin/pigeon stop

      - uses: actions/upload-artifact@v4
        with:
          name: installers-macos
          path: artifacts/out/*.pkg

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Version
        id: version
        run: echo "value=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/Pigeon.Cli/Pigeon.Cli.csproj)" >> "$GITHUB_OUTPUT"

      - name: Install rpmbuild
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Publish and package
        run: |
          for rid in linux-x64 linux-arm64; do
            dotnet publish src/Pigeon.Cli/Pigeon.Cli.csproj -c Release -r "$rid" -o "artifacts/$rid"
            sh packaging/linux/build-packages.sh '${{ steps.version.outputs.value }}' "$rid" "artifacts/$rid" artifacts/out
          done
          ls -la artifacts/out

      - name: Install and check
        run: |
          sudo apt-get install -y ./artifacts/out/pigeon_*_amd64.deb
          sh packaging/smoke-test.sh /usr/bin/pigeon '${{ steps.version.outputs.value }}'
          rpm -qip artifacts/out/pigeon-*.x86_64.rpm
          rpm -qlp artifacts/out/pigeon-*.x86_64.rpm | grep -qx /usr/bin/pigeon
          tar -tzf artifacts/out/pigeon-*-linux-x64.tar.gz | grep -q '/pigeon$'

      # Old builds (0.0.1), one installed by its deb and one unpacked from its tarball, update
      # themselves to the newest published release.
      - name: Update old installs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          dotnet publish src/Pigeon.Cli/Pigeon.Cli.csproj -c Release -r linux-x64 -p:Version=0.0.1 -o artifacts/old
          sh packaging/linux/build-packages.sh 0.0.1 linux-x64 artifacts/old artifacts/old-pkg
          sudo apt-get remove -y pigeon
          sudo apt-get install -y ./artifacts/old-pkg/pigeon_0.0.1_amd64.deb
          export PIGEON_PORT=29683 PIGEON_DATABASE="$RUNNER_TEMP/update.db" PIGEON_IDENTITY_DIR="$RUNNER_TEMP/update-identity"
          pigeon start
          pigeon update --allow-pre-release
          version=$(pigeon --version)
          [ "$version" != 0.0.1 ] || { echo "pigeon update left the deb at 0.0.1" >&2; exit 1; }
          echo "The deb updated to $version"
          pigeon stop
          mkdir -p "$RUNNER_TEMP/tarball"
          tar -xzf artifacts/old-pkg/pigeon-0.0.1-linux-x64.tar.gz -C "$RUNNER_TEMP/tarball"
          "$RUNNER_TEMP/tarball/pigeon-0.0.1/pigeon" update --allow-pre-release
          version=$("$RUNNER_TEMP/tarball/pigeon-0.0.1/pigeon" --version)
          [ "$version" != 0.0.1 ] || { echo "pigeon update left the tarball program at 0.0.1" >&2; exit 1; }
          echo "The tarball program updated to $version"

      - uses: actions/upload-artifact@v4
        with:
          name: installers-linux
          path: |
            artifacts/out/*.deb
            artifacts/out/*.rpm
            artifacts/out/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true

      - name: Record installer hashes
        run: |
          cd installers
          sha256sum *.msi *.pkg *.deb *.rpm *.tar.gz > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      # A draft: a person reads it and publishes it.
      - name: Create a draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/Pigeon.Cli/Pigeon.Cli.csproj)
          tag=${GITHUB_REF#refs/tags/}
          if [ "$tag" != "v$version" ]; then
            echo "The tag $tag does not match the version $version." >&2
            exit 1
          fi
          prerelease=
          case "$version" in *-*) prerelease=--prerelease ;; esac
          gh release create "$tag" --draft $prerelease --title "Pigeon $version" \
            --notes "Exploratory beta for Windows, macOS and Linux. Claude and Codex agent integration has been tried on Windows; macOS and Linux agent tests are requested. Installers are unsigned. Testers: start with [the beta testing guide](https://github.com/${{ github.repository }}/blob/$tag/docs/beta-testing.md) and [report results](https://github.com/${{ github.repository }}/issues/new?template=beta-report.yml). Changes: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/$tag/CHANGELOG.md). Asset hashes are in SHA256SUMS.txt." \
            installers/*
