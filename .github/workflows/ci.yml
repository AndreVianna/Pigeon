name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The Claude hook tests run under Git Bash on Windows and the system bash and sh elsewhere.
      - name: Check Git Bash
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bash = Join-Path $env:ProgramFiles 'Git\bin\bash.exe'
          if (-not (Test-Path $bash)) { throw "Git Bash not found at $bash" }
          & $bash -c 'sh --version | head -1'

      - name: Build
        run: dotnet build Pigeon.slnx --configuration Release

      - name: Test
        run: dotnet test Pigeon.slnx --configuration Release --no-build

      # The OpenCode plugin's wake logic is TypeScript; Node runs it with type stripping.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test the OpenCode plugin
        run: node --test integrations/opencode-plugin/waker.test.ts

      - name: Test the Copilot extension
        run: node --test integrations/copilot-plugin/waker.test.mjs

      # The tool package is the same on every platform, so one runner publishes it.
      - name: Pack
        if: runner.os == 'Windows'
        run: dotnet pack src/Pigeon.Cli/Pigeon.Cli.csproj --configuration Release --no-build --output artifacts

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: nupkg
          path: artifacts/*.nupkg
