name: Site

# Publishes site/ to GitHub Pages (https://andrevianna.github.io/Pigeon/) when it changes on main.
# Pages must be set once to "GitHub Actions" under Settings > Pages.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Upload and deploy run in separate jobs, as in GitHub's own Pages template. In one job,
  # deploy-pages can look for the artifact before GitHub lists it and fail with
  # 'No artifacts named "github-pages"' (actions/deploy-pages#451).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
