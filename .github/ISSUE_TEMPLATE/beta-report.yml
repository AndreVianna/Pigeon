name: Beta report
description: Report a Pigeon beta result, including partial or failed macOS and Linux tests.
title: "Beta report: <version> on <system>"
labels: ["beta report"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing. Follow [the beta guide](https://github.com/AndreVianna/Pigeon/blob/main/docs/beta-testing.md). Reports are public: use synthetic messages and redact real message bodies, machine names, addresses, join codes, session IDs and credentials. Partial results help too.
  - type: input
    id: version
    attributes:
      label: Pigeon version
      description: The output of `pigeon --version`.
      placeholder: 0.7.0-beta.1
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: Operating system, version and processor (for example Apple Silicon, Intel x64 or Linux ARM64).
      placeholder: macOS 15 on Apple Silicon
    validations:
      required: true
  - type: dropdown
    id: installer
    attributes:
      label: Installed with
      options:
        - Windows .msi
        - macOS .pkg
        - .deb
        - .rpm
        - .tar.gz
        - .NET tool
    validations:
      required: true
  - type: input
    id: agents
    attributes:
      label: Agent apps
      description: The apps and versions you tested with, and whether each ran in a terminal or desktop app.
      placeholder: Claude Code in Terminal; Codex desktop app
  - type: textarea
    id: results
    attributes:
      label: Results
      description: Each test you ran (T0–T5, R1–R6), with pass, fail or not run. Separate a stored message, one seen after polling, an automatic wake and an acknowledgment.
      placeholder: |
        T0 pass: CLI message received
        T2 partial: reply was stored, but the second agent saw it only after polling
        T3 not run
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Steps and diagnostics for each failure
      description: Steps, expected and actual result, any Pigeon window, and relevant redacted `pigeon status` or `pigeon peer list` output. State whether a restart or manual prompt was needed. Do not paste database files.
      render: text
  - type: textarea
    id: other
    attributes:
      label: Anything else
      description: Installer warnings, confusing wording, anything that surprised you.
